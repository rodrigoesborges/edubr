on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: false

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = !startsWith(OS, "windows"), install = FALSE)
        shell: Rscript {0}

      # pkgdown has no way to exclude root .md files (r-lib/pkgdown#2959);
      # AGENTS.md holds internal AI-agent instructions, keep it off the site.
      - name: Drop internal AGENTS page from site
        run: |
          rm -f docs/AGENTS.html
          grep -v "AGENTS" docs/sitemap.xml > docs/sitemap.xml.tmp && mv docs/sitemap.xml.tmp docs/sitemap.xml
          python3 - <<'PY'
          import json
          p = "docs/search.json"
          d = json.load(open(p))
          d = [e for e in d if "AGENTS" not in e.get("path", "")]
          json.dump(d, open(p, "w"), ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
